  <script>
    // Register Service Worker for PWA and Firebase Cloud Messaging (Root Scope)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' }).then(function (registration) {
          console.log('[FCM-PWA] ServiceWorker registered with root scope:', registration.scope);
        }).catch(function (error) {
          console.warn('[FCM-PWA] ServiceWorker registration warning:', error);
          // Fallback registration for relative paths
          navigator.serviceWorker.register('firebase-messaging-sw.js');
        });
      });

      // Listen for navigation messages from Service Worker
      navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'NAVIGATE_TO_ROUTE' && event.data.route) {
          window.location.hash = '#' + event.data.route;
        }
      });
    }

    // Helper functions exposed for Flutter Web Push integration
    window.MatrouhPush = {
      isIosSafariNonStandalone: function() {
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        return isIos && !isStandalone;
      },
      isPushSupported: function() {
        return ('Notification' in window) && ('serviceWorker' in navigator);
      },
      getPermissionStatus: function() {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission; // 'default', 'granted', 'denied'
      },
      requestPermission: async function() {
        if (!('Notification' in window)) return 'unsupported';
        const permission = await Notification.requestPermission();
        return permission;
      },
      ensureFcmServiceWorkerReady: async function() {
        if (!('serviceWorker' in navigator)) return null;
        try {
          const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' });
          await navigator.serviceWorker.ready;
          return reg.scope;
        } catch (e) {
          console.warn('[FCM] ensureFcmServiceWorkerReady error:', e);
          return null;
        }
      },
      showBrowserNotification: function(title, body, route) {
        if ('Notification' in window && Notification.permission === 'granted') {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then(function(reg) {
              reg.showNotification(title, {
                body: body,
                icon: '/icons/Icon-192.png',
                badge: '/icons/Icon-192.png',
                data: { route: route || '/' },
                vibrate: [200, 100, 200]
              });
            });
          } else {
            const notif = new Notification(title, {
              body: body,
              icon: '/icons/Icon-192.png',
              data: { route: route || '/' }
            });
            notif.onclick = function() {
              window.focus();
              if (route) window.location.hash = '#' + route;
            };
          }
          return true;
        }
        return false;
      }
    };
  </script>
